spring:
  datasource:
    url: jdbc:h2:mem:live_trip_updates;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: localhost
      port: 6379

app:
  security:
    dev-jwt-secret: local-development-secret-key-32-bytes
  events:
    redis-listener-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
