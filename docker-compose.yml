services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: live_trip_updates
      POSTGRES_USER: live_trip_updates
      POSTGRES_PASSWORD: live_trip_updates
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U live_trip_updates -d live_trip_updates"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/live_trip_updates
      SPRING_DATASOURCE_USERNAME: live_trip_updates
      SPRING_DATASOURCE_PASSWORD: live_trip_updates
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8080:8080"

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - app
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  postgres-data:
  redis-data:
